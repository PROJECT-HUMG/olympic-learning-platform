# Host ingress, after certificate issuance. API deliberately bypasses web nginx.
# Install as /etc/nginx/sites-available/olympic; no CDN/real_ip trust assumed.
server {
    listen 80;
    listen [::]:80;
    server_name olympic.nghlong3004.me;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://olympic.nghlong3004.me$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name olympic.nghlong3004.me;
    ssl_certificate /etc/letsencrypt/live/olympic.nghlong3004.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olympic.nghlong3004.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # API file/request caps remain25MB; allow multipart framing at ingress.
    client_max_body_size 26m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host olympic.nghlong3004.me;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host olympic.nghlong3004.me;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    location = /actuator { return 404; }
    location /actuator/ { return 404; }
    location = /swagger-ui { return 404; }
    location /swagger-ui/ { return 404; }
    location /v3/api-docs { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host olympic.nghlong3004.me;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
