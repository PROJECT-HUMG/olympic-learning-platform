name: olympic_platform

services:
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: olympic_platform
      POSTGRES_USER: olympic_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympic_platform -d olympic_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  mailpit:
    image: axllent/mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

    restart: unless-stopped

volumes:
  postgres-data:
  redis-data: