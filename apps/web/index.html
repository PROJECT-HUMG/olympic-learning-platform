<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympic HUMG</title>
    <script>
      // Match the persisted theme before the app bundle arrives.
      let theme = "system";
      try {
        theme = JSON.parse(localStorage.getItem("olympic-theme"))?.state?.theme ?? "system";
      } catch { /* Storage can be unavailable in private browsing. */ }
      const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    </script>
    <link rel="stylesheet" href="/src/app/loading-screen.css" />
  </head>
  <body>
    <div id="startup-loader" class="loading-screen loading-screen--startup" role="status" aria-live="polite" aria-label="Đang mở Olympic HUMG">
      <div class="loading-screen__content">
        <div class="loading-screen__logo">
          <img src="/icons.svg" alt="Logo trường HUMG" width="1095" height="1095" fetchpriority="high" />
        </div>
        <p class="loading-screen__brand">Olympic HUMG</p>
        <p class="loading-screen__message">Đang mở góc học tập…</p>
        <div class="loading-screen__writing" aria-hidden="true"><span></span></div>
        <p class="loading-screen__help">Chờ lâu? <a href="">Tải lại trang</a></p>
        <noscript>
          <style>
            .loading-screen__message, .loading-screen__writing, .loading-screen__percent, .loading-screen__help { display: none; }
          </style>
          <p class="loading-screen__message--static">Bật JavaScript trong trình duyệt để mở website.</p>
        </noscript>
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
