spring:
  application:
    name: olympic

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding:
        text: ${SPRING_AI_MODEL_EMBEDDING_TEXT:none}

server:
  servlet:
    context-path: /

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"

olympic:
  assessment:
    import:
      max-file-size-mb: ${ASSESSMENT_IMPORT_MAX_FILE_SIZE_MB:25}
      max-pages: ${ASSESSMENT_IMPORT_MAX_PAGES:100}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
        max-tokens: ${GEMINI_MAX_TOKENS:8192}
  storage:
    provider: ${STORAGE_PROVIDER:cloudinary}
  auth:
    registration:
      mode: ${OLYMPIC_AUTH_REGISTRATION_MODE:SELF_VERIFY}
    email-token:
      verification-expiration-minutes: ${OLYMPIC_EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}
      password-reset-expiration-minutes: ${OLYMPIC_PASSWORD_RESET_EXPIRATION_MINUTES:15}
  turnstile:
    enabled: ${TURNSTILE_ENABLED:false}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    allowed-hostnames: ${TURNSTILE_ALLOWED_HOSTNAMES:}
    timeout: ${TURNSTILE_TIMEOUT:2s}
  admin:
    email: ${OLYMPIC_ADMIN_EMAIL:}
    username: ${OLYMPIC_ADMIN_USERNAME:admin}
    password: ${OLYMPIC_ADMIN_PASSWORD:}
    full-name: ${OLYMPIC_ADMIN_FULL_NAME:Olympic Administrator}
