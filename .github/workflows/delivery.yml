name: Delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Web checks
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          node --test --test-isolation=none tests/*.test.ts
          pnpm build
      - name: Delivery offline checks
        run: |
          bash -n deploy/ssh-deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: API checks including PostgreSQL Testcontainers
        working-directory: apps/api
        env:
          # Synthetic CI config only. No production Environment credentials in PRs.
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          OLYMPIC_MAIL_ENABLED: "false"
        run: |
          docker info >/dev/null
          ./mvnw --batch-mode --no-transfer-progress verify
          python3 ../../deploy/check-test-reports.py target/surefire-reports
      - name: Retain API test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Image namespace and public build settings
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          VITE_TURNSTILE_ENABLED: ${{ vars.VITE_TURNSTILE_ENABLED || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          prefix="ghcr.io/${REPOSITORY,,}"
          [[ "$VITE_TURNSTILE_ENABLED" == false || "$VITE_TURNSTILE_ENABLED" == true ]]
          if [[ "$VITE_TURNSTILE_ENABLED" == true ]]; then test -n "$VITE_TURNSTILE_SITE_KEY"; fi
          printf 'prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish checked API
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/api
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-api:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish checked web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: apps/web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.prefix }}-web:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_TURNSTILE_ENABLED=${{ vars.VITE_TURNSTILE_ENABLED || 'false' }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            RELEASE_SHA=${{ github.sha }}
      - name: Freeze digest release bundle
        id: release
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          VITE_TURNSTILE_ENABLED: ${{ vars.VITE_TURNSTILE_ENABLED || 'false' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          release_id=$(python3 deploy/release.py create --output release.json)
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          tar -czf release.tar.gz release.json deploy/compose.prod.yml deploy/deploy.py deploy/release.py deploy/smoke.py
          printf 'Release: `%s`\nAPI: `%s`\nWeb: `%s`\n' "$release_id" "$API_DIGEST" "$WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release
          path: |
            release.tar.gz
            release.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    # Never cancel a running migration/deployment. Host lock also covers manual runs.
    concurrency:
      group: production-droplet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-release
      - name: Deploy exact release over verified SSH
        env:
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/ssh-deploy.sh
      - name: Public smoke from GitHub runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 deploy/smoke.py "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Deployment job: **%s**. Inspect host state/status.json on failure; no automatic rollback was attempted.\n' "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
