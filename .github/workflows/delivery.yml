name: Delivery

on:
  pull_request:
  push:
    branches: [main, deploy]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 action runtime
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24 action runtime
        with:
          node-version: "24"
      - name: Use the same pnpm as the server Docker build
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node 24 action runtime
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Web checks
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          node --test --test-isolation=none tests/*.test.ts
          pnpm build
      - name: Deployment scripts, Compose and Nginx checks
        run: |
          bash -n deploy/ssh-deploy.sh
          docker compose version >/dev/null
          docker info >/dev/null
          python3 -m unittest discover -s deploy/tests -v
      - name: API checks including PostgreSQL Testcontainers
        working-directory: apps/api
        env:
          # Synthetic CI config only. No production Environment credentials in PRs.
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          OLYMPIC_MAIL_ENABLED: "false"
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify
          python3 ../../deploy/check-test-reports.py target/surefire-reports
      - name: Retain API test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24 action runtime
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: production
    # Do not cancel an active build/migration. Host lock covers checkout + deploy.
    concurrency:
      group: production-droplet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24 action runtime
        with:
          persist-credentials: false
      - name: Checkout and build tested commit over verified SSH
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SEQUENCE: ${{ github.run_number }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/ssh-deploy.sh
      - name: Outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Deployment job: **%s**. Inspect /opt/olympic/state/status.json on failure; no automatic rollback was attempted.\n' "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
