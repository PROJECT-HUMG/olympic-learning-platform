name: Delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Web checks
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          node --test --test-isolation=none tests/*.test.ts
          pnpm build
      - name: Delivery offline checks
        run: |
          bash -n deploy/ssh-deploy.sh
          python3 -m unittest discover -s deploy/tests -v
      - name: API checks including PostgreSQL Testcontainers
        working-directory: apps/api
        env:
          # Synthetic CI config only. No production Environment credentials in PRs.
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
          GITHUB_CLIENT_ID: ci-placeholder
          GITHUB_CLIENT_SECRET: ci-placeholder
          OLYMPIC_MAIL_ENABLED: "false"
        run: |
          docker info >/dev/null
          ./mvnw --batch-mode --no-transfer-progress verify
          python3 ../../deploy/check-test-reports.py target/surefire-reports
      - name: Retain API test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: production
    # Do not cancel an active build/migration. Host lock covers checkout + deploy.
    concurrency:
      group: production-droplet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout and build tested commit over verified SSH
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SEQUENCE: ${{ github.run_number }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/ssh-deploy.sh
      - name: Public smoke from GitHub runner
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 deploy/smoke.py "$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          printf 'Deployment job: **%s**. Inspect /opt/olympic/state/status.json on failure; no automatic rollback was attempted.\n' "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
